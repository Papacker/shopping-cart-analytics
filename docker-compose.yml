services:
  mariadb-server:
    container_name: iiwari-mariadb-server
    image: mariadb:latest
    ports:
      - 3308:3306
    environment:
      - MYSQL_ROOT_PASSWORD: d41k4Duu
    volumes:
      - vol-iiwari-mariadb-data:/var/lib/mysql
    networks:
      - iiwari-network

  datascience-notebook:
    image: jupyter/scipy-notebook:latest
    container_name: jupyterlab2
    user: root
    volumes:
      - .:/home/jovyan/work
    ports:
      - 8887:8888
    environment:
      - JUPYTER_TOKEN=daika
      - GRANT_SUDO=yes
      - JUPYTER_ENABLE_LAB=yes
      - CHOWN_HOME=yes
    networks:
      - iiwari-network

  toolset:
    image: ubuntu:24.04
    container_name: project-tools
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - iiwari-network
    command: sleep infinity

networks:
  iiwari-network:
    external: false

volumes:
  vol-iiwari-mariadb-data:
    external: false