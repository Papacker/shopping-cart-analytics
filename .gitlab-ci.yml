image: python:3.11-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHONPATH: "$CI_PROJECT_DIR"

cache:
  paths:
    - .cache/pip
    - .cache/uv
    - .venv/

before_script:
  - pip install uv
  - uv venv .venv
  - source .venv/bin/activate
  - uv pip install . 

stages:
  - lint
  - test
  - quality

# --- LINT-VAIHE ---
linting:
  stage: lint
  tags:
    - docker
  script:
    - uv pip install pylint
    - echo "Running pylint on main components..."
    - pylint src/ tests/ main.py agentti/ --fail-under=5.0 > pylint-report.txt || (cat pylint-report.txt && true)
  allow_failure: true
  artifacts:
    paths:
      - pylint-report.txt
    expire_in: 1 week

# --- TEST-VAIHE ---
unit_tests:
  stage: test
  tags:
    - docker
  script:
    - echo "Installing test dependencies..."
    - uv pip install pytest pytest-mock pytest-cov pandas duckdb pyarrow streamlit crewai python-dotenv
    - echo "Running unit tests with coverage..."
    - python -m pytest tests/ -v --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'

# --- LAADUNVARMISTUS-VAIHE ---
quality_check:
  stage: quality
  tags:
    - docker
  script:
    - echo "Installing quality check tools..."
    - uv pip install pylint pytest-cov
    - echo "Running comprehensive quality checks..."
    # Run pylint with detailed output
    - pylint src/ tests/ main.py agentti/ || true
    # Run tests with coverage for final report
    - python -m pytest tests/ --cov=. --cov-report=xml:coverage.xml --cov-report=html:htmlcov
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 1 week

# --- ERITYIS_TESTIT (Parallellit työt) ---
test_etl:
  stage: test
  tags:
    - docker
  script:
    - uv pip install pytest pytest-mock pandas duckdb pyarrow
    - echo "Testing ETL functionality..."
    - python -m pytest tests/test_main.py -v
  allow_failure: false

test_ui:
  stage: test
  tags:
    - docker
  script:
    - uv pip install pytest pytest-mock streamlit pandas duckdb pyarrow
    - echo "Testing UI components..."
    - python -m pytest tests/test_app.py -v
  allow_failure: false

test_agents:
  stage: test
  tags:
    - docker
  script:
    - uv pip install pytest pytest-mock crewai python-dotenv
    - echo "Testing AI agents..."
    - python -m pytest tests/test_crew.py -v
  allow_failure: false