image: python:3.11-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  paths:
    - .cache/pip
    - .cache/uv

before_script:
  - pip install uv
  - uv venv
  - source .venv/bin/activate
  - uv pip install -r pyproject.toml 

stages:
  - lint
  - test

# --- LINT-VAIHE ---
lint:python:
  stage: lint
  script:
    - uv pip install pylint
    - pylint main.py app.py agentti/crew.py src/*.py --fail-under=5.0
  allow_failure: true

# --- TEST-VAIHE ---
test:logic:
  stage: test
  script:
    - uv pip install pytest coverage
    # Ajetaan testit ja seurataan kattavuutta
    - coverage run -m pytest tests/
    - coverage report -m
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# --- ERIKOISTESTIT (Valinnainen) ---
test:crew_logic:
  stage: test
  script:
    # Testataan vain agentin logiikka (ilman oikeaa LLM-kutsua, jos käytät mockeja)
    - pytest tests/test_crew.py

