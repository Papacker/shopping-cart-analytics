image: python:3.11-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHONPATH: "$CI_PROJECT_DIR"

cache:
  key: "$CI_COMMIT_REF_SLUG"  # Pitää välimuistin erillään eri haaroissa
  paths:
    - .cache/uv
    - .venv/

before_script:
  - pip install uv
  # LUODAAN venv VAIN JOS PUUTTUU (Tämä on nopeuden avain)
  - test -d .venv || uv venv .venv
  - source .venv/bin/activate

stages:
  - lint
  - test
  - quality

# --- LINT-VAIHE ---
linting:
  stage: lint
  tags: [docker]
  script:
    - uv pip install pylint
    - pylint src/ main.py agentti/ --fail-under=5.0 > pylint-report.txt
  artifacts:
    paths: [pylint-report.txt]
  allow_failure: true

# --- TEST-VAIHE (Parallel jobs) ---

# Yhteinen pohja testeille
.test_base: &test_base
  stage: test
  tags: [docker]

unit_tests:
  <<: *test_base
  script:
    - uv pip install . pytest pytest-mock pytest-cov
    - python -m pytest tests/ -v --cov=. --cov-report=xml:coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths: [coverage.xml]
  coverage: '/TOTAL.*\s+(\d+%)$/'

test_etl:
  <<: *test_base
  script:
    - uv pip install pytest pandas duckdb pyarrow
    - python -m pytest tests/test_main.py -v

test_ui:
  <<: *test_base
  script:
    - uv pip install pytest streamlit pandas
    - python -m pytest tests/test_app.py -v

test_agents:
  <<: *test_base
  script:
    - uv pip install pytest crewai python-dotenv
    - python -m pytest tests/test_crew.py -v

# --- LAADUNVARMISTUS-VAIHE ---
quality_check:
  stage: quality
  tags: [docker]
  script:
    - uv pip install pylint pytest-cov
    - pylint src/ main.py agentti/ || true
    - python -m pytest tests/ --cov=. --cov-report=html:htmlcov
  artifacts:
    paths: [htmlcov/]
    expire_in: 1 week